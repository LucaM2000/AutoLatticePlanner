
name: CI

on:
  push:
    branches: [ main, refactor ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.12]

    steps:
    - name: Checkout github repo
      uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -v -e .
          pip freeze
    - name: Create wheel
      run: |
          pip install build
          python -m build
          mkdir wheelhouse
          cp dist/auto_lattice* wheelhouse/
          ls wheelhouse
          rm -r dist
          mv wheelhouse dist
    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheel_autolatticeplanner
        path: dist/
